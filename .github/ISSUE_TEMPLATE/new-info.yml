name: "New law, rule or market information"
description: "A new rule, fee, court order or practice the app should know about."
title: "[new-info] "
labels: ["inbox", "bucket: new-info"]
body:
  - type: markdown
    attributes:
      value: "Please do not paste names, ID numbers, phone numbers or a real agreement. Describe the clause in your own words instead."
  - type: textarea
    id: details
    attributes:
      label: "What changed, and where did you see it?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source (optional)"
      description: "A link or the name of the law, notice or article."
