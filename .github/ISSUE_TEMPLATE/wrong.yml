name: "Something is wrong"
description: "A clause marked wrongly, a broken page, a wrong fact or a confusing message."
title: "[wrong] "
labels: ["inbox", "bucket: wrong"]
body:
  - type: markdown
    attributes:
      value: "Please do not paste names, ID numbers, phone numbers or a real agreement. Describe the clause in your own words instead."
  - type: textarea
    id: details
    attributes:
      label: "What went wrong, and what did you expect?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source (optional)"
      description: "A link or the name of the law, notice or article."
