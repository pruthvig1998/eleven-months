name: "Idea or feature"
description: "Something you would like Eleven Months to do, or do better."
title: "[idea] "
labels: ["inbox", "bucket: idea"]
body:
  - type: markdown
    attributes:
      value: "Please do not paste names, ID numbers, phone numbers or a real agreement. Describe the clause in your own words instead."
  - type: textarea
    id: details
    attributes:
      label: "What would you like it to do?"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source (optional)"
      description: "A link or the name of the law, notice or article."
