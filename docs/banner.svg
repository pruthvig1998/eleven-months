<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Eleven Months: read the fine print before it reads you">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3df2e0" stop-opacity=".34"/><stop offset="1" stop-color="#3df2e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c8ff3d" stop-opacity=".22"/><stop offset="1" stop-color="#c8ff3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#05070c"/><stop offset=".08" stop-color="#05070c" stop-opacity="0"/><stop offset=".92" stop-color="#05070c" stop-opacity="0"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1200" height="380" fill="#05070c"/>
    <circle r="340" cy="40" fill="url(#g1)"><animate attributeName="cx" values="900;1040;900" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="300" cy="400" fill="url(#g2)"><animate attributeName="cx" values="160;320;160" dur="18s" repeatCount="indefinite"/></circle>

    <!-- three clause cards in perspective, the middle one flagged -->
    <g transform="translate(760 62) skewY(-9)">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
        <g opacity=".55"><rect width="360" height="64" rx="10" fill="#0b1019" stroke="#96b9ff" stroke-opacity=".24"/><rect x="18" y="18" width="70" height="10" rx="5" fill="#3df2e0"/><rect x="18" y="38" width="290" height="8" rx="4" fill="#aab4cc" opacity=".35"/></g>
        <g transform="translate(-34 84)"><rect width="394" height="92" rx="10" fill="#0b1019" stroke="#ff4d79" stroke-width="2"/><rect width="5" height="92" fill="#ff4d79"/><rect x="22" y="18" width="52" height="16" rx="4" fill="none" stroke="#ff4d79"/><text x="48" y="30" text-anchor="middle" font-size="10" font-weight="700" fill="#ff4d79" letter-spacing="1.5">RISK</text><rect x="22" y="46" width="330" height="8" rx="4" fill="#e8edf8" opacity=".7"/><rect x="22" y="64" width="220" height="8" rx="4" fill="#e8edf8" opacity=".4"/>
          <rect x="0" y="0" width="394" height="3" fill="#c8ff3d" opacity=".9"><animate attributeName="y" values="0;89;0" dur="3.2s" repeatCount="indefinite"/></rect></g>
        <g transform="translate(0 196)" opacity=".55"><rect width="360" height="64" rx="10" fill="#0b1019" stroke="#96b9ff" stroke-opacity=".24"/><rect x="18" y="18" width="70" height="10" rx="5" fill="#3df2e0"/><rect x="18" y="38" width="250" height="8" rx="4" fill="#aab4cc" opacity=".35"/></g>
      </g>
    </g>

    <!-- mark: two rings, the outer one turning -->
    <g transform="translate(108 112)">
      <circle r="34" fill="none" stroke="#c8ff3d" stroke-width="6" stroke-dasharray="150 64"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="15" fill="none" stroke="#3df2e0" stroke-width="5"/>
    </g>
    <text x="164" y="128" font-size="46" font-weight="800" fill="#e8edf8" letter-spacing="3">ELEVEN MONTHS</text>
    <text x="72" y="204" font-size="30" font-weight="700" fill="#e8edf8">Read the fine print</text>
    <text x="72" y="244" font-size="30" font-weight="700" fill="#c8ff3d">before it reads you.</text>
    <text x="72" y="284" font-size="15" fill="#aab4cc" letter-spacing="2.5">RENTAL AGREEMENT CHECKER · BUILT FOR TELANGANA TENANTS</text>

    <!-- scrolling line of what it checks -->
    <g font-size="13" font-weight="600" fill="#aab4cc" letter-spacing="2">
      <g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1180 0" dur="26s" repeatCount="indefinite"/>
        <text x="40" y="346">DEPOSIT SIZE  ·  FORFEITURE  ·  NOTICE PERIOD  ·  LOCK-IN  ·  RENT INCREASES  ·  LANDLORD ENTRY  ·  WATER AND POWER CUTS  ·  RECEIPTS  ·  LOCK-OUT  ·  BLANK CHEQUES  ·</text>
        <text x="1220" y="346">DEPOSIT SIZE  ·  FORFEITURE  ·  NOTICE PERIOD  ·  LOCK-IN  ·  RENT INCREASES  ·  LANDLORD ENTRY  ·  WATER AND POWER CUTS  ·  RECEIPTS  ·  LOCK-OUT  ·  BLANK CHEQUES  ·</text>
      </g>
    </g>
    <rect y="322" width="1200" height="40" fill="url(#fade)"/>
    <rect x=".5" y=".5" width="1199" height="379" rx="22" fill="none" stroke="#96b9ff" stroke-opacity=".2"/>
  </g>
</svg>
